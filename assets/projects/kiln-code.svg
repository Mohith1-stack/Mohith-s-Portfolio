<text x="610" y="282" fill="#7d858f" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" letter-spacing="2">EDITOR / PAIR SUM</text>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20">
  <text x="620" y="354" fill="#4a525c">01</text><text x="680" y="354" fill="#c792ea">def</text><text x="725" y="354" fill="#82aaff">pair_sum</text><text x="830" y="354" fill="#ece6da">(values, target):</text>
  <text x="620" y="402" fill="#4a525c">02</text><text x="710" y="402" fill="#c4c9cd">seen = {}</text>
  <text x="620" y="450" fill="#4a525c">03</text><text x="710" y="450" fill="#c792ea">for</text><text x="755" y="450" fill="#c4c9cd">index, value</text><text x="900" y="450" fill="#c792ea">in</text><text x="928" y="450" fill="#82aaff">enumerate</text><text x="1036" y="450" fill="#ece6da">(values):</text>
  <text x="620" y="498" fill="#4a525c">04</text><text x="740" y="498" fill="#c792ea">if</text><text x="778" y="498" fill="#c4c9cd">target - value</text><text x="940" y="498" fill="#c792ea">in</text><text x="976" y="498" fill="#c4c9cd">seen:</text>
  <text x="620" y="546" fill="#4a525c">05</text><text x="770" y="546" fill="#c792ea">return</text><text x="845" y="546" fill="#c4c9cd">seen[target - value], index</text>
</g>
